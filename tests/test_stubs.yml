    [mypy]
    plugins = mypy_django_plugin.main

    [mypy.plugins.django-stubs]
    django_settings_module = tests.mypy_test_settings
  main: |
    from wagtail.blocks import StructBlock, CharBlock, StreamBlock
    class PersonBlock(StructBlock):
        first_name = CharBlock()
        last_name = CharBlock()
    class ContentStream(StreamBlock):
        person = PersonBlock()

