  main: |
    from collections.abc import Iterable
    from typing import Any

    from wagtail.contrib.frontend_cache.backends import BaseBackend
    from wagtail.contrib.frontend_cache.backends import CloudfrontBackend as WagtailCloudfrontBackend

    def warmable(urls: list[str]) -> list[str]:
        return urls

    class CloudfrontBackend(WagtailCloudfrontBackend):
        def purge_batch(self, urls: Iterable[str]) -> None:
            urls = list(urls)
            super().purge_batch(urls)
            warmable(urls)

    class LoggingBackend(BaseBackend):
        def __init__(self, params: dict[str, Any]) -> None:
            super().__init__(params)
            self.prefix = params.pop("PREFIX", "")

