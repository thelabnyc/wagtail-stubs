- case: apps_settings_policy_override_strict
  mypy_config: |
    [mypy]
    plugins = mypy_django_plugin.main
    strict = True

    [mypy.plugins.django-stubs]
    django_settings_module = tests.mypy_test_settings
  main: |
    from wagtail.contrib.settings.models import BaseGenericSetting, BaseSiteSetting
    from wagtail.permission_policies import ModelPermissionPolicy
    from wagtail.permission_policies.sites import SitePermissionPolicy

    class SocialSettings(BaseSiteSetting):
        pass

    class FooterSettings(BaseGenericSetting):
        @classmethod
        def get_permission_policy(cls) -> ModelPermissionPolicy["FooterSettings"]:
            return ModelPermissionPolicy(cls)

    class BarePolicySettings(BaseGenericSetting):
        @classmethod
        def get_permission_policy(cls) -> ModelPermissionPolicy:
            return ModelPermissionPolicy(cls)

    def check() -> None:
        reveal_type(SocialSettings.get_permission_policy())  # N: Revealed type is "wagtail.permission_policies.sites.SitePermissionPolicy[main.SocialSettings]"
        reveal_type(FooterSettings.get_permission_policy())  # N: Revealed type is "wagtail.permission_policies.base.ModelPermissionPolicy[main.FooterSettings]"
        site_policy: SitePermissionPolicy = SocialSettings.get_permission_policy()
  installed_apps:
    - main
