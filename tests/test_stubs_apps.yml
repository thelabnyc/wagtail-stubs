    warn_redundant_casts = True
    warn_unused_ignores = True

    [mypy.plugins.django-stubs]
    django_settings_module = tests.mypy_test_settings
  main: |
    from datetime import datetime
    from typing import NotRequired, TypedDict

    from django.db.models import Q
    from wagtail.contrib.sitemaps.sitemap_generator import Sitemap as WagtailSitemap
    from wagtail.models import Page

    class SitemapAltLink(TypedDict):
        location: str
        lang_code: str

    class SitemapURL(TypedDict):
        location: str
        lastmod: NotRequired[datetime]
        changefreq: NotRequired[str]
        priority: NotRequired[str]
        alternates: NotRequired[list[SitemapAltLink]]

    class Sitemap(WagtailSitemap):
        def items(self) -> list[Page]:
            default_root: Page = self.get_wagtail_site().root_page
            roots = [default_root] + list(default_root.get_translations())
            path_filter = Q()
            for root in roots:
                path_filter |= Q(path__startswith=root.path) & Q(depth__gte=root.depth)
            qs = (
                Page.objects.filter(path_filter)
                .live()
                .public()
                .defer_streamfields()
                .specific()
                .prefetch_related("locale")
                .order_by("depth", "path")
            )
            pages: list[Page] = [*qs.all()]
            for page in pages:
                page._sitemap_translations = []  # type: ignore[attr-defined]
            return pages

        def _urls(self, page: int, protocol: str, domain: str) -> list[SitemapURL]:
            urls: list[SitemapURL] = []
            last_mods: set[datetime] = set()

            for item in self.paginator.page(page).object_list:
                url_info_items = item.get_sitemap_urls(self.request)
                for url_info in url_info_items:
                    urls.append(url_info)
                    last_mods.add(url_info.get("lastmod"))

            if last_mods and None not in last_mods:
                self.latest_lastmod = max(last_mods)
            return urls

