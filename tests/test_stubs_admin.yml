- case: admin_page_viewset_view_classes
  mypy_config: |
    [mypy]
    plugins = mypy_django_plugin.main
    strict = True

    [mypy.plugins.django-stubs]
    django_settings_module = tests.mypy_test_settings
  main: |
    from wagtail.admin.views.pages.copy import CopyView
    from wagtail.admin.views.pages.edit import EditView
    from wagtail.admin.viewsets.pages import PageViewSet
    from wagtail.models import Page

    class BlogPage(Page):
        pass

    class BlogEditView(EditView):
        pass

    class BlogCopyView(CopyView):
        pass

    class BlogPageViewSet(PageViewSet):
        model = BlogPage
        edit_view_class = BlogEditView
        copy_view_class = BlogCopyView

    viewset = BlogPageViewSet()
    reveal_type(PageViewSet().model)  # N: Revealed type is "type[wagtail.models.pages.AbstractPage]"
    reveal_type(PageViewSet().copy_view_class)  # N: Revealed type is "type[wagtail.admin.views.pages.copy.CopyView]"
    reveal_type(viewset.edit_view_class)  # N: Revealed type is "def (**kwargs: Any) -> main.BlogEditView"
    reveal_type(viewset.edit_view)  # N: Revealed type is "def (*Any, **Any) -> django.http.response.HttpResponseBase"
    reveal_type(viewset.workflow_preview_view)  # N: Revealed type is "def (*Any, **Any) -> django.http.response.HttpResponseBase"

