    [mypy]
    plugins = mypy_django_plugin.main
    strict = True

    [mypy.plugins.django-stubs]
    django_settings_module = tests.mypy_test_settings
  main: |
    from wagtail.admin.views.generic import IndexView, PermissionCheckedMixin
    from wagtail.models import Site
    from wagtail.permission_policies import ModelPermissionPolicy

    class SiteIndexView(IndexView):
        model = Site
        permission_policy = ModelPermissionPolicy(Site)

    class NoPolicyView(PermissionCheckedMixin):
        permission_policy = None

    reveal_type(SiteIndexView().permission_policy)  # N: Revealed type is "wagtail.permission_policies.base.ModelPermissionPolicy[Any]"
