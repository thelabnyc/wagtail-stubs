- case: admin_menu_order_and_submenu_hook
  mypy_config: |
    [mypy]
    plugins = mypy_django_plugin.main
    strict = True

    [mypy.plugins.django-stubs]
    django_settings_module = tests.mypy_test_settings
  main: |
    from wagtail.admin.viewsets.base import ViewSet, ViewSetGroup

    class UnorderedViewSet(ViewSet):
        menu_order = None

    class OrderedViewSet(ViewSet):
        menu_order = 100

    class Group(ViewSetGroup):
        items = (UnorderedViewSet, OrderedViewSet)
        submenu_hook = "register_group_menu_item"

    reveal_type(UnorderedViewSet().menu_order)  # N: Revealed type is "None"
    reveal_type(UnorderedViewSet().get_menu_item_order())  # N: Revealed type is "int"
    reveal_type(OrderedViewSet().get_menu_item_order(5))  # N: Revealed type is "int"
    reveal_type(Group().submenu_hook)  # N: Revealed type is "str"

