- case: api_v3_auth_and_registry
  mypy_config: |
    [mypy]
    plugins = mypy_django_plugin.main

    [mypy.plugins.django-stubs]
    django_settings_module = tests.mypy_test_settings
  main: |
    from django.http import HttpRequest
    from wagtail.api.v3.auth import BearerTokenAuth
    from wagtail.api.v3.registry import ContentTypeRegistration, registry
    from wagtail.api.v3.schemas import PageSchema
    from wagtail.models import APIToken

    class ScopedTokenAuth(BearerTokenAuth):
        def authenticate(self, request: HttpRequest, token: str) -> APIToken | None:
            api_token = super().authenticate(request, token)
            return api_token if api_token and api_token.name.startswith("scoped") else None

    registry.register(ContentTypeRegistration(name="app.Thing", label="Thing", read_schema=PageSchema))
    reveal_type(registry.get("app.Thing"))  # N: Revealed type is "wagtail.api.v3.registry.ContentTypeRegistration | None"
    schemas = registry.get_type_schemas("app.Thing")
    if schemas is not None:
        reveal_type(schemas["read"])  # N: Revealed type is "dict[str, Any]"

