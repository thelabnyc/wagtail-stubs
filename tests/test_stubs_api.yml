- case: api_v3_register_field_schema_generic
  mypy_config: |
    [mypy]
    plugins = mypy_django_plugin.main

    [mypy.plugins.django-stubs]
    django_settings_module = tests.mypy_test_settings
  main: |
    from typing import Any

    from django.db import models
    from wagtail.api.v3.schemas.generators.read import FieldSchema, SchemaGenerator, read_generator
    from wagtail.api.v3.schemas.generators.write import InputFieldSchema, InputSchemaGenerator, create_generator

    class ColourField(models.CharField[str, str]):
        palette: list[str]

    def colour_schema(generator: SchemaGenerator, field: ColourField) -> FieldSchema:
        return (str, None, None)

    def colour_input_schema(generator: InputSchemaGenerator, field: ColourField) -> InputFieldSchema:
        return (str, ...)

    read_generator.register_field_schema(ColourField, colour_schema)
    create_generator.register_field_schema(ColourField, colour_input_schema)
    read_generator.register_field_schema(models.TextField, colour_schema)  # E: Argument 2 to "register_field_schema" of "SchemaGenerator" has incompatible type "Callable[[SchemaGenerator, ColourField], tuple[Any, Any, Callable[..., Any] | None]]"; expected "Callable[[SchemaGenerator, TextField[Any, Any]], tuple[Any, Any, Callable[..., Any] | None]]"  [arg-type]

- case: api_v3_require_any_permission_preserves_signature
  mypy_config: |
    [mypy]
    plugins = mypy_django_plugin.main

    [mypy.plugins.django-stubs]
    django_settings_module = tests.mypy_test_settings
  main: |
    from django.db.models import Model
    from django.http import HttpRequest
    from wagtail.api.v3.permissions import require_any_permission
    from wagtail.models import Site

    class TokenRequest(HttpRequest):
        token_name: str

    @require_any_permission(Site, ["view"])
    def list_sites(request: HttpRequest, limit: int = 20) -> list[Site]:
        return []

    def resolve_model(request: HttpRequest, *args: object, type: str, **kwargs: object) -> type[Model]:
        return Site

    @require_any_permission(resolve_model)
    def detail(request: TokenRequest, type: str, pk: str) -> Site:
        return Site()

    reveal_type(list_sites)  # N: Revealed type is "def (request: django.http.request.HttpRequest, limit: int =) -> list[wagtail.models.sites.Site]"
    reveal_type(detail)  # N: Revealed type is "def (request: main.TokenRequest, type: str, pk: str) -> wagtail.models.sites.Site"
    list_sites(request=HttpRequest(), limit=10)
    list_sites(HttpRequest(), limit="x")  # E: Argument "limit" to "list_sites" has incompatible type "str"; expected "int"  [arg-type]

