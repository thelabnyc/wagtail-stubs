  main: |
    from wagtail.models import Page, Site
    from wagtail.permission_policies import ModelPermissionPolicy
    from wagtail.permission_policies.pages import PagePermissionPolicy
    from wagtail.permissions import page_permission_policy, policy_registry, register_permission_policy

    class BlogPage(Page):
        pass

    register_permission_policy(Site)
    register_permission_policy(Site, ModelPermissionPolicy(Site), exact_class=True)
    register_permission_policy(BlogPage, PagePermissionPolicy.for_model(BlogPage))
    register_permission_policy(BlogPage, page_permission_policy)
    policy_registry.register(Site, ModelPermissionPolicy(Site))
    register_permission_policy(Site, ModelPermissionPolicy(Page))  # E: Cannot infer value of type parameter "M" of "register_permission_policy"  [misc]

- case: shared_page_permission_policy_generic
  mypy_config: |
    [mypy]
    plugins = mypy_django_plugin.main

    [mypy.plugins.django-stubs]
    django_settings_module = tests.mypy_test_settings
  main: |
    from django.contrib.auth.models import AbstractBaseUser
    from wagtail.models import Page
    from wagtail.permission_policies.pages import PagePermissionPolicy
    from wagtail.permissions import page_permission_policy, site_permission_policy

    class BlogPage(Page):
        pass

    def check(user: AbstractBaseUser) -> None:
        reveal_type(page_permission_policy)  # N: Revealed type is "wagtail.permission_policies.pages.PagePermissionPolicy[wagtail.models.pages.AbstractPage]"
        reveal_type(PagePermissionPolicy())  # N: Revealed type is "wagtail.permission_policies.pages.PagePermissionPolicy[wagtail.models.pages.AbstractPage]"
        reveal_type(PagePermissionPolicy(BlogPage))  # N: Revealed type is "wagtail.permission_policies.pages.PagePermissionPolicy[main.BlogPage]"
        reveal_type(PagePermissionPolicy("wagtailcore.Page"))  # N: Revealed type is "wagtail.permission_policies.pages.PagePermissionPolicy[Any]"
        policy = PagePermissionPolicy.for_model(BlogPage)
        reveal_type(policy)  # N: Revealed type is "wagtail.permission_policies.pages.PagePermissionPolicy[main.BlogPage]"
        reveal_type(policy.model)  # N: Revealed type is "type[main.BlogPage]"
        reveal_type(policy.instances_user_has_permission_for(user, "change"))  # N: Revealed type is "wagtail.models.pages.PageQuerySet[main.BlogPage]"
        reveal_type(policy.explorable_root_instance(user))  # N: Revealed type is "wagtail.models.pages.AbstractPage | None"
        reveal_type(site_permission_policy.model)  # N: Revealed type is "type[wagtail.models.sites.Site]"

