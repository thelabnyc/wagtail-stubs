  main: |
    from django.contrib.auth.models import AbstractBaseUser
    from wagtail.models import Page
    from wagtail.permission_policies import BasePermissionPolicy, ModelPermissionPolicy
    from wagtail.permission_policies.pages import PagePermissionPolicy
    from wagtail.permissions import policy_registry

    class MyPolicy(ModelPermissionPolicy):
        def user_has_permission(self, user: AbstractBaseUser, action: str) -> bool:
            return True

    class MyPagePolicy(PagePermissionPolicy):
        pass

    class TypedPolicy(ModelPermissionPolicy[Page]):
        pass

    bare: BasePermissionPolicy = policy_registry.get_by_type(Page)
    model_bare: ModelPermissionPolicy = MyPolicy(Page)
    reveal_type(MyPolicy(Page))  # N: Revealed type is "main.MyPolicy"
    reveal_type(TypedPolicy(Page).model)  # N: Revealed type is "type[wagtail.models.pages.Page]"

- case: shared_actions_generic
  mypy_config: |
    [mypy]
    plugins = mypy_django_plugin.main

    [mypy.plugins.django-stubs]
    django_settings_module = tests.mypy_test_settings
  main: |
    from django.contrib.auth.models import AbstractBaseUser
    from wagtail.actions import CreateAction, CreatePageAction, DeleteAction, EditAction, EditPageAction, RevertToRevisionAction
    from wagtail.models import Page, Revision, Site

    class BlogPage(Page):
        pass

    def check(user: AbstractBaseUser, site: Site, blog: BlogPage, home: Page, revision: Revision) -> None:
        reveal_type(CreateAction(site, user=user))  # N: Revealed type is "wagtail.actions.create.CreateAction[wagtail.models.sites.Site]"
        reveal_type(CreateAction(site).execute())  # N: Revealed type is "wagtail.models.sites.Site"
        reveal_type(CreateAction(site).permission_policy)  # N: Revealed type is "wagtail.permission_policies.base.BasePermissionPolicy[wagtail.models.sites.Site]"
        reveal_type(EditAction(site, publish=True).execute())  # N: Revealed type is "wagtail.models.sites.Site"
        reveal_type(DeleteAction(site).execute())  # N: Revealed type is "tuple[int, dict[str, int]]"
        reveal_type(RevertToRevisionAction(blog, revision).execute())  # N: Revealed type is "wagtail.models.revisions.Revision"
        reveal_type(CreatePageAction(blog, parent=home, user=user).execute())  # N: Revealed type is "main.BlogPage"
        reveal_type(CreatePageAction(blog, parent=home).permission_policy)  # N: Revealed type is "wagtail.permission_policies.pages.PagePermissionPolicy[main.BlogPage]"
        reveal_type(EditPageAction(blog).execute())  # N: Revealed type is "main.BlogPage"
        CreatePageAction(blog, parent=home, log_action="x")  # E: Unexpected keyword argument "log_action" for "CreatePageAction"  [call-arg]  # N: "CreatePageAction" defined in "wagtail.actions.create_page"

- case: shared_action_registry
  mypy_config: |
    [mypy]
    plugins = mypy_django_plugin.main

    [mypy.plugins.django-stubs]
    django_settings_module = tests.mypy_test_settings
  main: |
    from typing import Any
    from django.contrib.auth.models import AbstractBaseUser
    from wagtail.actions import BaseAction, CreateAction, action_registry
    from wagtail.models import Page, Revision, Site

    class ArchiveAction(BaseAction[Site]):
        action_name = "archive"

        def execute(self, skip_permission_checks: bool = False) -> None: ...

    reveal_type(action_registry.register(Site, ArchiveAction)(Site()))  # N: Revealed type is "main.ArchiveAction"
    reveal_type(action_registry.get_actions_for_model(Site))  # N: Revealed type is "dict[str, type[wagtail.actions.base.BaseAction[Any]]]"
    reveal_type(action_registry.get_action_class(Site, "create"))  # N: Revealed type is "type[wagtail.actions.base.BaseAction[Any]] | None"

    def publish(revision: Revision, user: AbstractBaseUser) -> None:
        action_class = action_registry.get_action_class(Page, "publish")
        assert action_class is not None
        action = action_class(revision, user=user)
        reveal_type(action)  # N: Revealed type is "wagtail.actions.base.BaseAction[Any]"
        reveal_type(action.execute())  # N: Revealed type is "Any"

